#     prefix: "team-a"
#     weight: 1
#     proxy-url: "direct"
#     models:
#       - name: "claude-sonnet-latest"
#         alias: "claude-sonnet"
#         display-name: "Claude Sonnet"
#         force-mapping: true
#         thinking:
#           levels: ["max", "xhigh", "high", "medium", "low", "minimal", "none", "auto"]
#     excluded-models:
#       - "*-haiku-*"
#     cloak:
#       mode: "auto"
#       strict-mode: false
#       cache-user-id: false

