#         force-mapping: true
#         thinking:
#           levels: ["xhigh", "high", "medium", "low"]
#     excluded-models:
#       - "*-mini"

# Optional Claude-compatible API keys. OAuth login is available through
# --claude-login. A custom base-url may point to a Claude Messages-compatible
# gateway while retaining the native Claude protocol path.
# claude-api-key:
#   - api-key: "sk-ant-..."
