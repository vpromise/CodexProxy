# Scoped CLIProxyAPI configuration.
# Native upstreams are limited to Codex and Claude. Third-party gateways must
# use openai-compatibility or an explicitly enabled plugin/SDK executor.
# Legacy provider keys are still accepted by the schema during staged cleanup,
# but the scoped server ignores them at runtime.

# Empty binds all interfaces and preserves container compatibility. Use
# "127.0.0.1" for a local-only desktop deployment.
host: ""
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # Remote management is disabled by default. Local requests still require the key.
  allow-remote: false
  # Leave empty to disable /v0/management entirely.
  secret-key: ""
  # The bundled panel is scoped to Codex, Claude, and OpenAI-compatible providers.
  disable-control-panel: false

# OAuth credentials are stored here. The scoped runtime loads only Codex,
# Claude, and explicitly compatible/plugin credentials.
auth-dir: "~/.cli-proxy-api"

# Replace this example value before starting the proxy. The server safe mode
# disables proxy endpoints while a known example key remains configured.
api-keys:
  - "your-api-key-1"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

commercial-mode: false
logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
usage-statistics-enabled: false
redis-usage-queue-retention-seconds: 60

# Global upstream proxy. Per-credential proxy-url values override it; use
# "direct" on a credential to bypass global and environment proxies.
proxy-url: ""

# Require a configured prefix when a credential has one.
force-model-prefix: false

# Forward safe upstream response headers to clients when enabled.
passthrough-headers: false

# Retry and credential failover policy.
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false
save-cooldown-status: false
transient-error-cooldown-seconds: 0

routing:
  # Supported values: round-robin, weighted-round-robin, fill-first.
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "1h"

# Claude behavior. Default auto cloaking applies only to non-Claude-Code clients.
disable-claude-cloak-mode: false
claude-code:
  disable-cloaking-model-list: false

# Codex behavior.
codex:
  identity-confuse: false
  disable-codex-cloaking: false
  stream-bootstrap-buffering: false
  optimize-multi-agent-v2: false
  live-media-relay:
    enabled: false
    max-sessions: 32
    disable-private-remote-ips: false
    public-ip: ""
    udp-port-min: 0
    udp-port-max: 0

# false keeps Codex image generation available. Other supported values are
# true, "chat", and "passthrough".
disable-image-generation: false

nonstream-keepalive-interval: 0
streaming:
  keepalive-seconds: 0
  bootstrap-retries: 0

# Optional Codex-compatible API keys. OAuth login is also available through
# --codex-login and --codex-device-login.
